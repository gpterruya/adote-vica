# Site estático (pasta site/): gera, verifica, tira capturas de tela e
# publica no Firebase Hosting (Google Cloud).
#   pull request → prévia em um endereço temporário (comentado no PR)
#   push na main → site oficial (adotevica.com.br)
# A publicação só acontece se todas as verificações passarem e se o
# segredo FIREBASE_SERVICE_ACCOUNT e a variável FIREBASE_PROJECT_ID
# estiverem configurados no repositório (README, seção 7.5).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pull-requests: write # comentário com o endereço da prévia
  checks: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      PUBLICAR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.FIREBASE_PROJECT_ID != '' }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        run: npm run build

      - name: Verificar (sem valores em R$, SEO, GTM, links, alt das imagens…)
        run: npm run check

      - name: Instalar o navegador para as capturas
        run: npx playwright install --with-deps chromium

      - name: Capturas de tela (celular, tablet, computador) e rolagem horizontal
        run: |
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ --timeout 60000
          node scripts/capturas.mjs http://localhost:4321/ capturas

      - name: Guardar as capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: site/capturas/
          retention-days: 14

      - name: Publicar prévia (pull request)
        if: github.event_name == 'pull_request' && env.PUBLICAR == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: site
          expires: 7d

      - name: Publicar o site oficial (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUBLICAR == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: site
          channelId: live
