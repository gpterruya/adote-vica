# Site estático (pasta site/): gera, verifica, tira capturas de tela e
# publica no Firebase Hosting (Google Cloud).
#   pull request → prévia em um endereço temporário (comentado no PR)
#   push na main → site oficial (adotevica.com.br)
# A publicação só acontece se todas as verificações passarem e se as
# variáveis FIREBASE_PROJECT_ID, GCP_WIF_PROVIDER e GCP_SERVICE_ACCOUNT
# estiverem configuradas no repositório (README, seção 7.5).
#
# Autenticação sem chave (Workload Identity Federation): o GitHub prova ao
# Google, a cada execução, que é este repositório, e recebe um acesso
# temporário à conta de serviço. Não há chave JSON nem segredo guardado.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pull-requests: write # comentário com o endereço da prévia
  id-token: write # token OIDC para a Workload Identity Federation do Google

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      PUBLICAR: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        run: npm run build

      - name: Verificar (sem valores em R$, SEO, GTM, links, alt das imagens…)
        run: npm run check

      - name: Instalar o navegador para as capturas
        run: npx playwright install --with-deps chromium

      - name: Capturas de tela (celular, tablet, computador) e rolagem horizontal
        run: |
          npx astro preview --port 4321 &
          npx wait-on http://localhost:4321/ --timeout 60000
          node scripts/capturas.mjs http://localhost:4321/ capturas

      - name: Guardar as capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: site/capturas/
          retention-days: 14

      # Pull requests vindos de forks não publicam (não recebem o token OIDC).
      - name: Autenticar no Google Cloud (sem chave)
        id: google
        if: env.PUBLICAR == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publicar prévia (pull request)
        if: steps.google.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes firebase-tools@15.34.2 hosting:channel:deploy "pr-$PR" --expires 7d \
            --project "$FIREBASE_PROJECT_ID" --json > previa.json
          url=$(node -e "const r=require('./previa.json').result; console.log(Object.values(r)[0].url)")
          echo "Prévia: $url" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --create-if-none --body \
            "Prévia do site (válida por 7 dias): $url — commit ${SHA::7}"

      - name: Publicar o site oficial (main)
        if: steps.google.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes firebase-tools@15.34.2 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
